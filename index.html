<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applies a saved light/dark choice before first paint, so switching
      // themes never flashes the other one on load. Dark is the default —
      // nothing here runs if no choice has been saved yet.
      try {
        var t = localStorage.getItem('mi-theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08080a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Baloo 2: used only for the Inflated Letters experiment's balloon
         glyphs — round, heavy terminals that read as "puffy" on their own,
         before any gradient or highlight is layered on top. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap"
      rel="stylesheet"
    />
    <title>Microinteractions — an 800×600 stage</title>
    <meta
      name="description"
      content="A fixed 800×600 stage for building, slowing down, and studying microinteractions."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
